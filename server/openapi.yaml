openapi: 3.0.3
info:
  title: Real Estate API
  version: 1.0.0
  description: |
    Backend for the real-estate technical challenge. Provides authentication,
    properties, agents, users, wishlist, and agent contact endpoints.

    Seed accounts (default password: `Test123!`):
      - test@example.com (user)
      - agent@example.com (agent)
      - admin@example.com (admin)

    Send `Authorization: Bearer <token>` for any authenticated endpoint.
    POST `/api/test/reset` restores the database to its seed (non-production only).
servers:
  - url: http://localhost:3001
    description: Local dev
  - url: /
    description: Same-origin (when SPA is served from the API)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        details: {}
    Role:
      type: string
      enum: [user, agent, admin]
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        avatar: { type: string }
        phone: { type: string }
      required: [id, email, name, role]
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
      required: [user, token]
    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
    RegisterRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, description: "8+ chars, upper, digit, special" }
        phone: { type: string }
        role:
          type: string
          enum: [user, agent]
      required: [name, email, password, phone]
    PropertyLocation:
      type: object
      properties:
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }
      required: [address, city, state, zipCode]
    PropertyFeatures:
      type: object
      properties:
        bedrooms: { type: integer, minimum: 0 }
        bathrooms: { type: number, minimum: 0 }
        area: { type: number, minimum: 0 }
        yearBuilt: { type: integer, minimum: 1800 }
      required: [bedrooms, bathrooms, area, yearBuilt]
    PropertyAgentRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
    Property:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        location: { $ref: '#/components/schemas/PropertyLocation' }
        features: { $ref: '#/components/schemas/PropertyFeatures' }
        type:
          type: string
          enum: [sale, rent, commercial]
        status:
          type: string
          enum: [available, sold, under-contract]
        images:
          type: array
          items: { type: string }
        agent: { $ref: '#/components/schemas/PropertyAgentRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, title, description, price, location, features, type, status, images, agent, createdAt, updatedAt]
    PropertyCreate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: number }
        location: { $ref: '#/components/schemas/PropertyLocation' }
        features: { $ref: '#/components/schemas/PropertyFeatures' }
        type:
          type: string
          enum: [sale, rent, commercial]
        status:
          type: string
          enum: [available, sold, under-contract]
        images:
          type: array
          items: { type: string }
      required: [title, description, price, location, features, type]
    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        avatar: { type: string }
        bio: { type: string }
        specialization: { type: string }
        experience: { type: number }
        rating: { type: number }
        reviews: { type: integer }
        listings: { type: integer }
        location: { type: string }
      required: [id, name, email, phone, specialization, location]
    WishlistResponse:
      type: object
      properties:
        propertyIds:
          type: array
          items: { type: string }
    ContactMessageRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        message: { type: string }
      required: [name, email, message]
    AgentMessage:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        fromUserId: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    UpdateMeRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        avatar: { type: string }
        currentPassword: { type: string }
        newPassword: { type: string }

paths:
  /api/health:
    get:
      summary: Health probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  env: { type: string }

  /api/auth/login:
    post:
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/register:
    post:
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Validation failed
        '409':
          description: Email already registered

  /api/auth/me:
    get:
      summary: Current user from bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Missing/invalid token

  /api/properties:
    get:
      summary: List properties
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [sale, rent, commercial] } }
        - { in: query, name: status, schema: { type: string, enum: [available, sold, under-contract] } }
        - { in: query, name: minPrice, schema: { type: number } }
        - { in: query, name: maxPrice, schema: { type: number } }
        - { in: query, name: bedrooms, schema: { type: integer } }
        - { in: query, name: bathrooms, schema: { type: number } }
        - { in: query, name: location, schema: { type: string } }
        - { in: query, name: q, schema: { type: string }, description: Free-text on title/description }
        - { in: query, name: sort, schema: { type: string, enum: [price_asc, price_desc, newest, oldest] } }
      responses:
        '200':
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Property' }
    post:
      summary: Create a property (agent or admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '401': { description: Missing token }
        '403': { description: Forbidden }

  /api/properties/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get a single property
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { description: Not found }
    put:
      summary: Update (owner or admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyCreate' }
      responses:
        '200':
          description: Updated property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      summary: Delete (owner or admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '403': { description: Forbidden }
        '404': { description: Not found }

  /api/agents:
    get:
      summary: List agents
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: specialization, schema: { type: string } }
        - { in: query, name: location, schema: { type: string } }
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }

  /api/agents/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get a single agent
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404': { description: Not found }

  /api/agents/{agentId}/messages:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    post:
      summary: Send a message to an agent (auth optional)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageRequest' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMessage' }
        '404': { description: Agent not found }

  /api/users:
    get:
      summary: List users (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { description: Forbidden }

  /api/users/me:
    put:
      summary: Update own profile / change password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated profile (new token included)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /api/users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    put:
      summary: Update user (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                role: { $ref: '#/components/schemas/Role' }
                avatar: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      summary: Delete user (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '400': { description: Cannot delete yourself }
        '403': { description: Forbidden }
        '404': { description: Not found }

  /api/users/me/wishlist:
    get:
      summary: Get wishlist (full property objects)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Property' }

  /api/users/me/wishlist/{propertyId}:
    parameters:
      - { in: path, name: propertyId, required: true, schema: { type: string } }
    post:
      summary: Add property to wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistResponse' }
        '404': { description: Property not found }
    delete:
      summary: Remove property from wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistResponse' }

  /api/test/reset:
    post:
      summary: Reset the database to its seed (non-production only)
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '404': { description: Disabled in production }
