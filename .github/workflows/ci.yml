name: Playwright End-to-End Tests

on:
  push:
    branches:
      - 'vidonism/tests'
  pull_request:
    branches:
      - 'vidonism/tests'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    # Fetch repository source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup Node.js environment for the App
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Install frontend dependencies
    - name: Install Node Dependencies
      run: npm install

    # Start App and wait natively for Port 5173
    - name: Start App & Wait for Port 5173
      run: |
        npm run dev -- --host 127.0.0.1 < /dev/null &
        npx wait-on tcp:127.0.0.1:5173 --timeout 60000

    # Setup .NET 10 SDK environment
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Build the test project to restore tools and dependencies
    - name: Build Test Project
      run: dotnet build tests/DemoTests/DemoTests.csproj

    # Install Playwright browser binaries required by .NET
    - name: Install Playwright Browsers & Linux Dependencies
      run: pwsh $(find . -name playwright.ps1 | head -n 1) install --with-deps
      
    - name: Install Playwright Edge Browser as well
      run: pwsh $(find . -name playwright.ps1 | head -n 1) install msedge

    # Execute xUnit tests and output results into a TRX file
    - name: Run Playwright Tests
      run: |
        dotnet test tests/DemoTests/DemoTests.csproj --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults
      env:
        # Pass the URLs
        TestBaseUrl: http://localhost:5173
        APIBaseUrl: http://localhost:3001/api

    # Upload test reports as a GitHub artifact (always runs even if tests fail)
    - name: Publish Test Report Summary
      if: always() 
      uses: dorny/test-reporter@v1
      with:
        name: Playwright Test Results
        path: "**/TestResults/*.trx" 
        reporter: dotnet-trx
